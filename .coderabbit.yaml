# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "ru-RU"
early_access: false

reviews:
  profile: "chill"
  auto_approvals:
    enabled: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
  path_instructions:
    - path: "scripts/**"
      instructions: |
        Контекст проекта:
        - Клиентский модуль для Foundry VTT v13 (проверено на 13.351) и системы Forbidden Lands (13.0.5).
        - Модуль используется за доверительным дружеским столом; серверного бэкенда и многодокументных транзакций в Foundry VTT нет.
        - Активный GM ведёт игру в одной вкладке браузера.
        - Главный источник архитектурных правил — файл ARCHITECTURE.md в корне репозитория.

        На чём ФОКУСИРОВАТЬ ревью (отмечай как реальные баги / Major):
        - Воспроизводимые повторный урон, повторное списание валюты, пропуск дня или потерю/порчу пользовательских данных (в том числе если они вызваны текущими очередями, обработчиками или старыми механизмами).
        - Краши в рантайме и несовместимость с Foundry VTT v13 (ApplicationV1/V2, DialogV2, чтение формы через button.form, хуки рендера).
        - Удаление исходных данных в Wash или миграциях без простой проверки того, что новая запись/стадия действительно сохранилась.
        - Нарушение правила fail-fast: тихая подстановка текущей даты или неверных значений при ошибке расчёта (например, в Calendaria / addDays).
        - Гонки пересекающихся операций (например, Rest игрока и обработка дня у GM), обход общей очереди активного GM, отсутствие перепроверки актуального состояния уже после входа в очередь, отсутствие защиты от двойного клика в UI или накопление слушателей DOM при перерисовке листа.
        - Реальные проблемы безопасности: вставка неэкранированного пользовательского ввода через innerHTML (XSS) и отсутствие проверок прав доступа (GM / isOwner).

        Ограничения на ПРЕДЛАГАЕМЫЕ РЕШЕНИЯ и вне-скоупные допущения:
        - НЕ предлагай и НЕ требуй распределённые/межвкладочные блокировки в базе данных (например, через ActiveEffect) и протоколы восстановления «брошенных» блокировок.
        - НЕ предлагай и НЕ требуй журналы автоматического восстановления (автодоигрывания), браузерные хранилища сверки (reconciliation stores) и сохраняемые в БД флаги/отметки «нужна ручная сверка» для многошаговых операций (переводы валюты, Rest, New Day, Calendaria).
        - Ожидаемая политика при частичном сбое многошаговой записи или обрыве связи: немедленная остановка (fail-fast) и явное уведомление GM (шёпот в чат ChatMessage при подтверждённом сбое, предупреждение в UI при обрыве связи) с чётким различением «подтверждённого сбоя» и «неизвестного исхода». Дальнейшую сверку и правку GM делает вручную.
        - Для защиты от гонок между игроком и GM предлагай простые решения: маршрутизация пересекающихся операций через единую очередь активного GM, перепроверка состояния после входа в очередь и блокировка кнопки в UI.
        - Не помечай как Major нереалистичные крайние случаи (тысячи одновременных пользователей, злонамеренные игроки, искусственное переполнение чисел сверх разумных игровых значений, если обычная игра работает корректно).
    - path: "templates/**"
      instructions: |
        Handlebars-шаблоны для Foundry VTT v13. Проверяй корректность путей данных, отсутствие неэкранированного пользовательского ввода через тройные скобки {{{...}}} без явной санитизации и совместимость структуры с DOM-адаптером листа Forbidden Lands.
    - path: "dev-tests/**"
      instructions: |
        Тесты на Node.js с моками глобальных объектов Foundry VTT. Не придирайся к упрощениям в тестовых заглушках и стабах, если сам тест честно проверяет игровую логику, очередь операций или политику остановки при сбое.

chat:
  auto_reply: true
