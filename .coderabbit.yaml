# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "ru-RU"
early_access: false

reviews:
  profile: "chill"
  auto_approvals:
    enabled: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
  path_instructions:
    - path: "scripts/**"
      instructions: |
        Контекст проекта:
        - Клиентский модуль для Foundry VTT v13 (проверено на 13.351) и системы Forbidden Lands (13.0.5).
        - Модуль используется за доверительным дружеским столом; серверного бэкенда и многодокументных транзакций в Foundry VTT нет.
        - Активный GM ведёт игру в одной вкладке браузера.
        - Главный источник архитектурных правил — файл ARCHITECTURE.md в корне репозитория.

        На чём ФОКУСИРОВАТЬ ревью во всех файлах (реальные баги / Major):
        - Краши в рантайме и несовместимость с Foundry VTT v13 (ApplicationV1/V2, DialogV2, чтение формы через button.form, хуки рендера).
        - Реальная потеря или порча пользовательских данных в обычных игровых сценариях (например, потеря массивов при штатном сохранении, сломанное перетаскивание, сброс данных при обычном клике).
        - Утечки и накопление слушателей DOM при перерисовке листа персонажа.
        - Реальные проблемы безопасности: вставка неэкранированного/несанитизированного HTML через innerHTML (XSS) и отсутствие проверок прав доступа (GM / isOwner).

        Глобальные ограничения на ПРЕДЛАГАЕМЫЕ РЕШЕНИЯ и шум (НЕ помечать как Major/Minor):
        - НЕ предлагай и НЕ требуй распределённые/межвкладочные блокировки в базе данных (например, через ActiveEffect) и протоколы восстановления «брошенных» блокировок.
        - НЕ предлагай и НЕ требуй журналы автоматического восстановления (автодоигрывания), браузерные хранилища сверки (reconciliation stores) и сохраняемые в БД флаги/отметки «нужна ручная сверка».
        - Для обычных UI-файлов (biography.js, reputation.js, willpower.js, quick-access.js, data-hygiene.js, gear/panel/tooltips) НЕ помечай как Major или Heavy lift миллисекундные микрогонки на время debounce или одного actor.update() (например: GM отозвал права владения ровно во время debounce набора текста; пользователь закрыл и мгновенно заново открыл диалог за 50 мс до конца сохранения; пользователь удалил предмет или открыл второй поповер в момент выполнения actor.update).
        - Для обычных UI-форм (BIO, Pilgrim Card, Reputation, Willpower, Quick Access) НЕ требуй шёпота GM в ChatMessage и строгих протоколов сверки при сбое сохранения.
        - Игнорируй нереалистичные крайние случаи (тысячи одновременных пользователей, злонамеренные игроки, искусственное переполнение чисел сверх разумных игровых значений).
    - path: "scripts/{wallet,money-transfer,rest,new-day,state-progression,operation-queue,document-writes}.js"
      instructions: |
        Критичная игровая логика (валюта, переводы, отдых, новый день, Calendaria, очереди).
        Дополнительно ФОКУСИРУЙ ревью на следующем:
        - Воспроизводимые повторный урон, повторное списание валюты, пропуск дня в Calendaria или порча данных.
        - Нарушение правила fail-fast: тихая подстановка текущей даты или неверных значений при ошибке расчёта (например, в Calendaria / addDays).
        - Гонки пересекающихся операций (например, Rest игрока и обработка дня у GM), обход общей очереди активного GM, отсутствие перепроверки актуального состояния уже после входа в очередь, отсутствие защиты от двойного клика в UI.
        - Политика при частичном сбое многошаговой записи или обрыве связи: немедленная остановка (fail-fast) и явное уведомление GM (шёпот в чат ChatMessage при подтверждённом сбое, предупреждение в UI при обрыве связи) с различением «подтверждённого сбоя» и «неизвестного исхода». Дальнейшую сверку и правку GM делает вручную — без журналов автовосстановления и БД-блокировок.
    - path: "scripts/conditions/**"
      instructions: |
        Критичная игровая логика состояний (STAT, Wash, Addiction, Heat/Mor, миграции).
        Дополнительно ФОКУСИРУЙ ревью на следующем:
        - Воспроизводимые повторный урон, повторный утренний бросок Addiction или потеря состояний.
        - Удаление исходных данных в Wash или миграциях без простой проверки того, что новая запись/стадия действительно сохранилась.
        - Обход общей очереди активного GM и отсутствие перепроверки состояния после входа в очередь для пересекающихся операций (New Day / Addiction / Calendaria).
        - При частичном сбое многошаговой записи: немедленная остановка (fail-fast) и явное уведомление GM (шёпот в ChatMessage при подтверждённом сбое) без журналов автовосстановления и БД-блокировок.
    - path: "scripts/integration/**"
      instructions: |
        Сокеты, маршрутизация операций через активного GM и публичные API для сторонних модулей.
        Фокусируйся на сохранении публичных контрактов, проверках прав доступа, предотвращении повторной регистрации хуков и корректной маршрутизации в единую очередь активного GM (без БД-блокировок и журналов сверки).
    - path: "templates/**"
      instructions: |
        Handlebars-шаблоны для Foundry VTT v13. Проверяй корректность путей данных, отсутствие неэкранированного пользовательского ввода через тройные скобки {{{...}}} без явной санитизации и совместимость структуры с DOM-адаптером листа Forbidden Lands.
    - path: "dev-tests/**"
      instructions: |
        Тесты на Node.js с моками глобальных объектов Foundry VTT. Не придирайся к упрощениям в тестовых заглушках и стабах, если сам тест честно проверяет игровую логику, очередь операций или политику остановки при сбое.

chat:
  auto_reply: true
